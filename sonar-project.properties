sonar.projectKey=Ambiance
sonar.projectName=Ambiance
sonar.host.url=https://sonarqube.ambiance-ensitech.me
sonar.login=${SONAR_TOKEN}

# Optionnel selon ton projet :
# sonar.sources=src
# sonar.language=js
# sonar.sourceEncoding=UTF-8
sonar.branch.name=develop

# ===== FRONTEND (Angular) =====
sonar.sources=ambiance-front/src
sonar.tests=ambiance-front/src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/*.module.ts,**/*.routing.ts
sonar.javascript.lcov.reportPaths=ambiance-front/coverage/ambiance-front-/lcov.info

# ===== BACKEND (NestJS ou autre) =====
sonar.sources=ambiance-back/src
sonar.tests=ambiance-back/src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**
sonar.typescript.lcov.reportPaths=ambiance-back/coverage/lcov.info

# Général
sonar.sourceEncoding=UTF-8