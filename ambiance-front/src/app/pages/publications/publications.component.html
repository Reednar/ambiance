<h1 class="text-4xl font-bold text-black mb-6 border-l-4 pl-4 border-gray-400" style="padding-top: 80px;">
    Les événements pour vous
</h1>

<!-- Barre de recherche et filtres -->
<div class="flex flex-wrap gap-4 mb-2">
    <!-- Champ de recherche -->
    <div class="w-full md:w-1/2 lg:w-1/3">
        <div class="relative">
            <input type="text" [(ngModel)]="searchQuery" (ngModelChange)="filterPublications()" 
                placeholder="Mot-clé de recherche"
                class="w-full py-2 pl-10 pr-4 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" />
            <i class="pi pi-search absolute top-1/2 left-3 transform -translate-y-1/2 text-gray-400 text-lg"></i>
        </div>
    </div>
    
    <!-- Conteneur pour les filtres -->
    <div class="flex w-full sm:w-auto space-x-4">
        <!-- Filtre par catégories -->
        <div class="w-full sm:w-1/2 md:w-1/3">
            <p-multiSelect [options]="categories" [(ngModel)]="selectedCategories" defaultLabel="Sélectionner des catégories"
                class="w-full" (onChange)="filterPublications()">
            </p-multiSelect>
        </div>
    
        <!-- Filtre par date -->
        <div class="w-full sm:w-1/2 md:w-1/3">
            <input type="date"  (ngModelChange)="filterPublications()"
                class="w-full py-2 px-4 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" />
        </div>
    </div>
</div>

<!-- Affichage des publications -->
<div class="articles-container">
    <div class="article-card" *ngFor="let publication of filteredPublications">
        <div class="image-wrapper">
            <img [src]="publication.image" alt="Article image">
            <span class="read-time">{{ publication.codePostal }} €</span>
        </div>
        <div class="article-content">
            <div class="author-info">
                <img [src]="publication.autheurAvatar" alt="Author">
                <div class="categories">
                    <span class="category" *ngFor="let cat of publication.categories">{{ cat }}</span>
                </div>
            </div>
            <h3 class="title">{{ publication.titre }}</h3>
            <div class="article-meta">
                <span class="views">{{ publication.vus | number }}</span>
                <span class="date">{{ publication.date | date: 'EEE, MMM yyyy' }}</span>
            </div>
        </div>
    </div>
</div>
