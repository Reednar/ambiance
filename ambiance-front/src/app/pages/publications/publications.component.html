        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
            <h3 class="h2 mt-2 text-white me-auto" style="text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6);">
                Voir les événements disponibles
            </h3>

            <div class="card flex justify-content-center">
                <p-calendar [(ngModel)]="rangeDates" selectionMode="range" [readonlyInput]="true" [showIcon]="true"
                    [placeholder]="'Sélectionner une plage de dates'" dateFormat="dd/mm/yy" class="custom-calendar">
                </p-calendar>



            </div>



            <!-- Bouton Filtrer -->
            <div class="dropdown">
                <button class="btn btn-secondary dropdown-toggle" type="button" id="filterDropdown"
                    data-bs-toggle="dropdown" aria-expanded="false"
                    style="background-color: transparent; border: 1px solid white; color: white;">
                    Filtrer
                </button>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="filterDropdown">
                    <li><a class="dropdown-item" (click)="filterByCategory('sport')">Sport</a></li>
                    <li><a class="dropdown-item" (click)="filterByCategory('musique')">Musique</a></li>
                    <li><a class="dropdown-item" (click)="filterByCategory('jeux')">Jeux</a></li>
                    <li><a class="dropdown-item" (click)="filterByCategory('divers')">Divers</a></li>
                </ul>
            </div>
        </div>

          <div class="container">
            <div class="row g-3">
              <div class="col-6 col-md-4 col-lg-3" *ngFor="let pub of publications">
                <div class="poste-card">
                  
                  <!-- Nom de l'école -->
                  <div class="poste-ecole">Ensitech</div>
                  <img *ngIf="pub.image" [src]="pub.image" alt="Image de l'événement" class="poste-img" onerror="this.onerror=null;this.src='assets/images/backgrounds/bde.png';"/>

                  <div class="poste-body">
                    <div>
                      <div class="poste-titre">{{ pub.titre }}</div>
                      <div class="poste-prix">{{ pub.prix | number:'1.0-2' }} €</div>
                    </div>
                    <div class="poste-categories">
                      <span *ngFor="let cat of pub.publicationCategories">
                        {{ cat.categorie.nom }}
                      </span>
                      <span *ngFor="let cat of pub.publicationCategories">
                        {{ cat.categorie.nom }}
                      </span>
                      <span *ngFor="let cat of pub.publicationCategories">
                        {{ cat.categorie.nom }}
                      </span>
                    </div>
                  </div>
          
                  <!-- Participants -->
                  <div class="poste-participants">
                    <!-- {{ pub.participants.length }}/{{ pub.limiteParticipants }} -->
                      5/10
                  </div>
          
                </div>
              </div>
            </div>
          </div>
