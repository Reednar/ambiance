<div class="container py-5">
  <h1 class="display-6 fw-bold text-white mb-4 border-start border-4 ps-3 border-primary testStyle">
    Page de modération
  </h1>

  <!-- Navigation Tabs -->
  <ul class="nav nav-tabs mb-4">
    <li class="nav-item">
      <a class="nav-link active" id="users-tab" data-bs-toggle="tab" href="#users">Utilisateurs</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" id="posts-tab" data-bs-toggle="tab" href="#posts">Publications</a>
    </li>
  </ul>

  <!-- Tab Content -->
  <div class="tab-content">
    <!-- Users Section -->
    <div class="tab-pane fade show active" id="users">
      <ag-grid-angular
        class="ag-theme-alpine-dark"
        [rowData]="users"
        [columnDefs]="userColumnDefs"
        [defaultColDef]="defaultColDef"
        [animateRows]="true"
        style="width: 100%; height: 400px;">
      </ag-grid-angular>
    </div>

    <!-- Posts Section -->
    <div class="tab-pane fade" id="posts">
      <ag-grid-angular
        [rowData]="posts"
        [columnDefs]="postColumnDefs"
        [defaultColDef]="defaultColDef"
        [animateRows]="true"
        style="width: 100%; height: 400px;">
      </ag-grid-angular>
    </div>
  </div>
</div>

<!-- Modal for User Deletion -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="deleteModalLabel">Confirmation pour suppression de l'utilisateur</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        Êtes-vous sûr de vouloir supprimer cet utilisateur ?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
        <button type="button" class="btn btn-primary" (click)="onDelete()">Confirmer</button>
      </div>
    </div>
  </div>
</div>
