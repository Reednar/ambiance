<!-- login.component.html -->
<div class="min-h-screen d-flex align-items-center justify-content-center px-3" style="padding-top: 100px; padding-bottom: 20px;">
  <div class="card shadow-lg border-0 rounded-4 p-2 p-sm-3 w-100" style="max-width: 500px;">
    <h2 class="text-center mb-4 fw-bold text-white" style="padding-top: 10px;">Connexion</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onLoginSubmit()">
      <!-- Email Field -->
      <div class="mb-4">
        <label for="mail" class="form-label fw-semibold">Email</label>
        <input type="email"
               id="mail"
               class="form-control form-control-lg rounded-3"
               formControlName="mail"
               placeholder="exemple@mail.com">
      </div>

      <!-- Password Field -->
      <div class="mb-4">
        <label for="password" class="form-label fw-semibold">Mot de passe</label>
        <input type="password"
               id="password"
               class="form-control form-control-lg rounded-3"
               formControlName="password"
               placeholder="••••••••">
      </div>

      <!-- Submit Button -->
      <button type="submit"
              class="btn btn-primary btn-lg w-100 mb-3 shadow-sm">
        <i class="pi pi-sign-in me-2"></i>Se connecter
      </button>

      <!-- Separator -->
      <div class="text-center text-muted my-3">
        <span class="px-2">OU</span>
        <hr>
      </div>

      <!-- Google Button -->
      <button type="button"
              class="btn btn-outline-secondary btn-lg w-100 mb-2 shadow-sm">
        <i class="pi pi-google me-2"></i>Se connecter avec Google
      </button>

      <!-- Forgot Password -->
      <div class="text-center mt-3">
        <a routerLink="/forgot-password" class="text-decoration-none text-muted small">
          Mot de passe oublié ?
        </a>
      </div>

      <!-- Register Link -->
      <div class="text-center mt-3">
        <span class="text-muted small">Pas encore inscrit ? </span>
        <a routerLink="/register" class="text-primary fw-semibold text-decoration-none small">
          Créez un compte ici
        </a>
      </div>
    </form>
  </div>
</div>
