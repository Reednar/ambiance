<div class="min-vh-100 d-flex align-items-center justify-content-center px-3" style="padding-top: 100px; padding-bottom: 20px;">
  <div class="card shadow-lg border-0 rounded-4 p-2 p-sm-3 w-100" style="max-width: 600px;">
    <h2 class="text-center mb-4 fw-bold text-dark">Inscription</h2>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <!-- Username Field -->
      <div class="mb-3">
        <label for="username" class="form-label fw-semibold">Nom d'utilisateur</label>
        <input type="text"
               id="username"
               class="form-control form-control-lg rounded-3"
               formControlName="username"
               placeholder="Votre nom d'utilisateur">
      </div>

      <!-- Email Field -->
      <div class="mb-3">
        <label for="email" class="form-label fw-semibold">Email</label>
        <input type="email"
               id="email"
               class="form-control form-control-lg rounded-3"
               formControlName="email"
               placeholder="exemple@mail.com">
      </div>

      <!-- Password Field -->
      <div class="mb-3">
        <label for="password" class="form-label fw-semibold">Mot de passe</label>
        <input type="password"
               id="password"
               class="form-control form-control-lg rounded-3"
               formControlName="password"
               placeholder="••••••••">
      </div>

      <!-- Confirm Password Field -->
      <div class="mb-3">
        <label for="confirmPassword" class="form-label fw-semibold">Confirmer le mot de passe</label>
        <input type="password"
               id="confirmPassword"
               class="form-control form-control-lg rounded-3"
               formControlName="confirmPassword"
               placeholder="••••••••">
      </div>

      <!-- Terms Checkbox -->
      <div class="form-check mb-4">
        <input type="checkbox"
               class="form-check-input"
               id="reglement"
               [(ngModel)]="reglement"
               name="reglement">
        <label class="form-check-label small text-muted ms-1" for="reglement">
          J'accepte le règlement
        </label>
      </div>

      <!-- Submit Button -->
      <button type="submit"
              class="btn btn-primary btn-lg w-100 mb-3 shadow-sm">
        <i class="pi pi-check me-2"></i>S'inscrire
      </button>

      <!-- Separator -->
      <div class="text-center text-muted my-3">
        <span class="px-2">OU</span>
        <hr>
      </div>

      <!-- Google Button -->
      <button type="button"
              class="btn btn-outline-secondary btn-lg w-100 mb-2 shadow-sm">
        <i class="pi pi-google me-2"></i>Se connecter avec Google
      </button>

      <!-- Links -->
      <div class="text-center mt-3">
        <a routerLink="/forgot-password" class="text-decoration-none text-muted small">
          Mot de passe oublié ?
        </a>
      </div>
      <div class="text-center mt-2">
        <span class="text-muted small">Déjà un compte ? </span>
        <a routerLink="/login" class="text-primary fw-semibold text-decoration-none small">
          Connectez-vous ici
        </a>
      </div>
    </form>
  </div>
</div>
