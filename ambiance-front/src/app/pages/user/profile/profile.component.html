<div class="container pt-5 pt-md-4 pt-lg-2" style="min-height: 600px; padding-bottom: 20px;">
  <div class="row justify-content-center">
    <div class="col-lg-10 testStyle">

      <div class="card p-4 shadow-sm">
        <div class="row align-items-center">
          <!-- Partie gauche (image + pseudo) -->
          <div class="col-md-4 text-center">
            <div class="profile-pic mb-3">
              <img 
                [src]="user.profileImageUrl || 'https://via.placeholder.com/150'" 
                class="rounded-circle img-fluid shadow-sm" 
                alt="Photo de profil" 
                style="width: 150px; height: 150px; object-fit: cover;"
              />
            </div>
            <h4 class="fw-bold">{{ user.username }}</h4>
          </div>

          <!-- Partie droite (infos modifiables) -->
          <div class="col-md-8">
            <form (ngSubmit)="saveProfile()" #profileForm="ngForm">
              <div class="row g-3">
                <div class="col-sm-6">
                  <label class="form-label">Prénom</label>
                  <input 
                    type="text" 
                    class="form-control editable" 
                    pInputText 
                    [(ngModel)]="user.firstName" 
                    name="firstName" 
                    required
                  />
                </div>
                <div class="col-sm-6">
                  <label class="form-label">Nom</label>
                  <input 
                    type="text" 
                    class="form-control editable" 
                    pInputText 
                    [(ngModel)]="user.lastName" 
                    name="lastName" 
                    required
                  />
                </div>
                <div class="col-sm-6">
                  <label class="form-label">Date de naissance</label>
                  <input 
                    type="date" 
                    class="form-control editable" 
                    [(ngModel)]="user.birthDate" 
                    name="birthDate" 
                    required
                  />
                </div>
                <div class="col-sm-6">
                  <label class="form-label">Ville</label>
                  <input 
                    type="text" 
                    class="form-control editable" 
                    pInputText 
                    [(ngModel)]="user.city" 
                    name="city" 
                    required
                  />
                </div>
                <div class="col-12">
                  <label class="form-label">École</label>
                  <input 
                    type="text" 
                    class="form-control editable" 
                    pInputText 
                    [(ngModel)]="user.school" 
                    name="school"
                  />
                </div>
              </div>

              <div class="d-flex justify-content-end mt-4">
                <button 
                  type="submit" 
                  class="btn btn-success" 
                  [disabled]="!profileForm.form.valid">
                  Sauvegarder
                </button>
              </div>
            </form>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>
