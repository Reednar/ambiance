<h1 class="text-4xl font-bold text-black mb-6 border-l-4 pl-4 border-gray-400" style="padding-top: 80px;">
  Votre calendrier avec vos événements prévus
</h1>

<full-calendar [options]="calendarOptions"></full-calendar>

<div class="articles-container">
  <h2>Les prochaines sorties/événements</h2>
  <ul>
    <li *ngFor="let event of events">
      <strong>{{ event.title }}</strong> - {{ event.date | date:'fullDate' }}
    </li>
  </ul>
</div>
