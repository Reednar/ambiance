<div class="grid grid-cols-1 md:grid-cols-2 gap-4" #pdfContent>

  <div class="card p-4 h-full flex flex-col">
      <h5>Sessions</h5>
      <p-chart class="flex-1"
        type="bar"
        [data]="{
          labels: countDates,
          datasets: [
            {
              label: 'Nombre de publications',
              data: countValues,
              backgroundColor: '#42A5F5'
            }
          ]
        }"
      ></p-chart>
  </div>

  <div class="card p-4 h-full flex flex-col">
      <h5>Énergie</h5>
      <p-chart class="flex-1"
        type="bar"
        [data]="{
          labels: countDates,
          datasets: [
            {
              label: 'Nombre de publications',
              data: countValues,
              backgroundColor: '#42A5F5'
            }
          ]
        }"
      ></p-chart>
  </div>

  <div class="card p-4 h-full flex flex-col">
      <h5>Recette (indicatives en HT)</h5>
      <p-chart class="flex-1"
        type="bar"
        [data]="{
          labels: countDates,
          datasets: [
            {
              label: 'Nombre de publications',
              data: countValues,
              backgroundColor: '#42A5F5'
            }
          ]
        }"
      ></p-chart>
  </div>

  <div class="card p-4 h-full flex flex-col">
      <h5>Disponibilité des bornes</h5>
      <p-chart class="flex-1"
        type="bar"
        [data]="{
          labels: countDates,
          datasets: [
            {
              label: 'Nombre de publications',
              data: countValues,
              backgroundColor: '#42A5F5'
            }
          ]
        }"
      ></p-chart>
  </div>

</div>
