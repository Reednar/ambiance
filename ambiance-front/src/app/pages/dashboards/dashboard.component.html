<h1 class="text-4xl font-bold text-black mb-6 border-l-4 pl-4 border-gray-400" style="padding-top: 80px;">
  Dashboards pour les statistiques
</h1>

<p-card class="w-full">
  <ng-template pTemplate="title">Statistiques des Publications</ng-template>
  <ng-template pTemplate="content">
    <div class="w-full">
      <p-chart
        type="bar"
        [data]="{
          labels: countDates,
          datasets: [
            {
              label: 'Nombre de publications',
              data: countValues,
              backgroundColor: '#42A5F5'
            }
          ]
        }"
        class="w-full h-64 sm:h-52 md:h-64 lg:h-80"
      ></p-chart>
    </div>
  </ng-template>
</p-card>
