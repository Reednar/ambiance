<div class="container mt-5 text-light" style="padding-top: 100px !important;">
  <h2 class="mb-4">Mes articles</h2>

  <div class="table-responsive">
    <table class="table table-dark table-hover table-bordered align-middle">
      <thead class="table-active">
        <tr>
          <th>Titre</th>
          <th>Contenu</th>
          <th>Date de création</th>
          <th>École</th>
          <th>Tags</th>
          <th>Actions</th> <!-- Nouvelle colonne -->
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let article of paginatedArticles">
          <td>{{ article.titre }}</td>
          <td>{{ article.contenu | slice:0:50 }}{{ article.contenu.length > 50 ? '...' : '' }}</td>
          <td>{{ article.dateCreation | date: 'dd/MM/yyyy' }}</td>
          <td>{{ article.nomEcole || '—' }}</td>
          <td>
            <span *ngFor="let tag of article.tags" class="badge me-1">{{ tag }}</span>
          </td>
          <td>
            <div class="btn-group" role="group">
              <!-- Voir -->
              <a [routerLink]="['/article', article.id]" class="btn btn-outline-info btn-sm" title="Voir">
                <i class="bi bi-eye"></i>
              </a>
              <!-- Modifier -->
              <a [routerLink]="['/article-update', article.id]" class="btn btn-outline-warning btn-sm" title="Modifier">
                <i class="bi bi-pencil"></i>
              </a>
              <!-- Supprimer -->
              <button (click)="deleteArticle(article.id)" class="btn btn-outline-danger btn-sm" title="Supprimer">
                <i class="bi bi-trash"></i>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <nav class="mt-3">
    <ul class="pagination justify-content-center">
      <li class="page-item" [class.disabled]="currentPage === 1">
        <button class="page-link bg-dark text-light" (click)="prevPage()">Précédent</button>
      </li>

      <li class="page-item" *ngFor="let page of [].constructor(totalPages); let i = index"
          [class.active]="i + 1 === currentPage">
        <button class="page-link bg-dark text-light" (click)="goToPage(i + 1)">{{ i + 1 }}</button>
      </li>

      <li class="page-item" [class.disabled]="currentPage === totalPages">
        <button class="page-link bg-dark text-light" (click)="nextPage()">Suivant</button>
      </li>
    </ul>
  </nav>
</div>
