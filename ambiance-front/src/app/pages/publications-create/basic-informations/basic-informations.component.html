    <form class="p-fluid">
        <div class="p-field">
        <label for="titre">Titre</label>
        <input id="titre" type="text" pInputText [(ngModel)]="titre" name="titre" required />
        <small *ngIf="submitted && !titre" class="p-error">Le titre est requis.</small>
        </div>
    
        <div class="p-field">
        <label for="date">Date</label>
        <p-calendar id="date" [(ngModel)]="date" name="date" showIcon dateFormat="dd/mm/yy" required></p-calendar>
        </div>
    
        <div class="p-field">
        <label for="nbPersonnes">Nombre de personnes</label>
        <input id="nbPersonnes" type="number" pInputText [(ngModel)]="nbPersonnes" name="nbPersonnes" required />
        <small *ngIf="submitted && nbPersonnes <= 0" class="p-error">Indiquez un nombre valide.</small>
        </div>
    
        <div class="p-field">
        <label for="prix">Prix</label>
        <input id="prix" type="number" pInputText [(ngModel)]="prix" name="prix" required />
        <small *ngIf="submitted && prix <= 0" class="p-error">Indiquez un prix valide.</small>
        </div>
    
        <div class="p-field">
        <label for="description">Description</label>
        <textarea id="description" pInputTextarea [(ngModel)]="description" name="description" required></textarea>
        <small *ngIf="submitted && !description" class="p-error">La description est requise.</small>
        </div>
    
        <div class="p-field">
        <label for="categories">Catégories</label>
        <p-multiSelect 
        id="categories" 
        [(ngModel)]="categories" 
        name="categories" 
        [options]="categoriesOptions" 
        placeholder="Sélectionnez des catégories">
      </p-multiSelect>        <small *ngIf="submitted && categories.length === 0" class="p-error">Sélectionnez au moins une catégorie.</small>
        </div>
    
        <div class="footer">
        <button pButton label="Précédent" class="p-button-secondary"></button>
        <button pButton label="Suivant" class="p-button-primary" (click)="nextPage()"></button>
        </div>
    </form>
    
    <style>
        .footer {
        display: flex;
        justify-content: space-between;
        border-top: 1px solid #ddd;
        padding-top: 1rem;
        margin-top: 1rem;
        }
    </style>
