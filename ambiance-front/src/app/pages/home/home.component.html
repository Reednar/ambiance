<h1>Bienvenue sur la page d'accueil</h1>
<p>Contenu de la page d'accueil</p>

<div class="articles-container">
    <div class="article-card" *ngFor="let article of articles">
        <div class="image-wrapper">
            <img [src]="article.image" alt="Article image">
            <span class="read-time">{{ article.readTime }} €</span>
        </div>
        <div class="article-content">
            <div class="author-info">
                <img [src]="article.authorAvatar" alt="Author">
                <div class="categories">
                    <span class="category" *ngFor="let cat of article.category">{{ cat }}</span>
                </div>
            </div>
            <h3 class="title">{{ article.title }}</h3>
            <div class="article-meta">
                <span class="views">{{ article.views | number }}</span>
                <span class="date">{{ article.date | date: 'EEE, MMM yyyy' }}</span>
            </div>
        </div>
    </div>
</div>
