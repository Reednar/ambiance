<div class="container">
    <h1 class="display-5 fw-bold text-white mb-4 border-start ps-3 border-secondary" style="padding-top: 100px;">
        Les participants de l'événement
    </h1>

    <div class="gradient-custom-2 h-100 py-4">
        <div class="mask d-flex align-items-start h-100">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-12">
                        <div class="table-responsive" style="overflow-x: auto;">
                            <table class="table table-dark table-bordered mb-0 text-nowrap">
                                <thead>
                                    <tr>
                                        <th>Nom</th>
                                        <th>Prénom</th>
                                        <th>Pseudo</th>
                                        <th>Email</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr *ngFor="let participant of participants">
                                        <td>{{ participant.nom }}</td>
                                        <td>{{ participant.prenom }}</td>
                                        <td>{{ participant.pseudo }}</td>
                                        <td>{{ participant.mail }}</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
