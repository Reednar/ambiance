<!-- login.component.html -->
<div class="min-h-screen d-flex align-items-center justify-content-center px-3"
  style="padding-top: 100px; padding-bottom: 20px;">
  <div class="card shadow-lg border-0 rounded-4 p-2 p-sm-3 w-100" style="max-width: 500px;">
    <h2 class="text-center mb-4 fw-bold text-white" style="padding-top: 10px;">Connexion</h2>
    <!-- <p-toast></p-toast> -->

    <form [formGroup]="loginForm" (ngSubmit)="onLoginSubmit()">
      <!-- Email Field -->
      <div class="mb-4">
        <label for="mail" class="form-label fw-semibold">Email</label>
        <input type="email" id="mail" class="form-control form-control-lg rounded-3"
          [ngClass]="{'is-invalid': loginFailed}" formControlName="mail" placeholder="exemple@mail.com">
      </div>

      <!-- Password Field -->
      <!-- <div class="mb-4">
        <label for="password" class="form-label fw-semibold">Mot de passe</label>
        <input type="password" id="password" class="form-control form-control-lg rounded-3"
          [ngClass]="{'is-invalid': loginFailed}" formControlName="password" placeholder="••••••••">
        <div *ngIf="loginFailed" class="invalid-feedback d-block">
          Email ou mot de passe incorrect.
        </div>
      </div> -->
<div class="mb-4 position-relative">
        <label for="password" class="form-label fw-semibold">Mot de passe</label>
        <input [type]="passwordVisible ? 'text' : 'password'" id="password"
          class="form-control form-control-lg rounded-3" [ngClass]="{'is-invalid': loginFailed}"
          formControlName="password" placeholder="••••••••" />

        <!-- Bouton œil positionné à droite dans le champ -->
        <button type="button" (click)="togglePasswordVisibility()"
          class="btn btn-sm btn-outline-secondary position-absolute"
          style="top: 38px; right: 10px; z-index: 2; border: none; background: transparent; padding: 0;">
          <i class="pi" [ngClass]="passwordVisible ? 'bi bi-eye' : 'bi bi-eye-slash'"></i>
        </button>

        <div *ngIf="loginFailed" class="invalid-feedback d-block">
          Email ou mot de passe incorrect.
        </div>
      </div>


      <!-- Two-Factor Authentication Code Field -->
      <div class="mb-4" *ngIf="twoFactorRequired">
        <label for="code" class="form-label fw-semibold">Code 2FA</label>
        <input type="text" id="code" class="form-control form-control-lg rounded-3"
          [ngClass]="{'is-invalid': loginFailed}" formControlName="code" placeholder="Entrez le code reçu par mail" />
        <div *ngIf="loginForm.get('code')?.invalid && (loginForm.get('code')?.touched || loginForm.get('code')?.dirty)"
          class="invalid-feedback d-block">
          Le code 2FA est requis.
        </div>
        <button type="button" class="btn btn-link p-0 mt-2" (click)="onResend2FACode()">
          Renvoyer le code
        </button>
      </div>


      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary btn-lg w-100 mb-3 shadow-sm">
        <i class="pi pi-sign-in me-2"></i>Se connecter
      </button>

      <!-- Forgot Password -->
      <div class="text-center mt-3">
        <a routerLink="/forgot-password" class="text-decoration-none text-muted small">
          Mot de passe oublié ?
        </a>
      </div>

      <!-- Register Link -->
      <div class="text-center mt-3">
        <span class="text-muted small">Pas encore inscrit ? </span>
        <a routerLink="/register" class="text-primary fw-semibold text-decoration-none small">
          Créez un compte ici
        </a>
      </div>
    </form>
  </div>
</div>
