<h1 class="text-4xl font-bold text-black mb-6 border-l-4 pl-4 border-gray-400" style="padding-top: 80px;">
  Dashboards pour les statistiques
</h1>

<div class="grid grid-cols-1 md:grid-cols-2 gap-4" #pdfContent>

  <div class="card p-4 h-full flex flex-col">
    <h5>Sessions</h5>
    <p-chart class="flex-1" type="bar" [data]="{
          labels: countDates,
          datasets: [
            {
              label: 'Nombre de publications',
              data: countValues,
              backgroundColor: '#42A5F5'
            }
          ]
        }"></p-chart>
  </div>

  <div class="card p-4 h-full flex flex-col">
    <h5>Énergie</h5>
    <p-chart class="flex-1" type="bar" [data]="{
          labels: countDates,
          datasets: [
            {
              label: 'Nombre de publications',
              data: countValues,
              backgroundColor: '#42A5F5'
            }
          ]
        }"></p-chart>
  </div>

  <div class="card p-4 h-full flex flex-col">
    <h5>Recette (indicatives en HT)</h5>
    <p-chart class="flex-1" type="bar" [data]="{
          labels: countDates,
          datasets: [
            {
              label: 'Nombre de publications',
              data: countValues,
              backgroundColor: '#42A5F5'
            }
          ]
        }"></p-chart>
  </div>

  <div class="card p-4 h-full flex flex-col">
    <h5>Disponibilité des bornes</h5>
    <p-chart class="flex-1" type="bar" [data]="{
          labels: countDates,
          datasets: [
            {
              label: 'Nombre de publications',
              data: countValues,
              backgroundColor: '#42A5F5'
            }
          ]
        }"></p-chart>
  </div>

</div>
