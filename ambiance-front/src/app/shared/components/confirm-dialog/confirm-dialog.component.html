<div class="dialog-backdrop" *ngIf="visible">
  <div class="dialog">
    <h2>{{ title }}</h2>
    <p>{{ message }}</p>
    <div class="buttons">
      <button (click)="onCancel()" class="cancel">{{ cancelText }}</button>
      <button (click)="onConfirm()" class="confirm">{{ confirmText }}</button>
    </div>
  </div>
</div>
